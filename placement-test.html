<style>
:root{--primary:#0F4C29;--primary-dark:#09321A;--primary-light:#17693B;--gold:#C6952B;--gold-light:#E8C568;--gold-grad:linear-gradient(135deg,#E2BE5B,#BA8921);--bg:#FAF9F4;--card:#ffffff;--ink:#16291d;--mut:#5d6b60;--line:#E7E2D3;--ok:#16a34a;--bad:#dc2626;--wa:#25D366;--pri:#0F4C29;--hl:rgba(198,149,43,.14)}
:root[data-theme="dark"]{--bg:#071A10;--card:#0E291B;--ink:#F5F3EC;--mut:#b4c2b6;--line:rgba(232,197,104,.22);--pri:#E8C568;--hl:rgba(232,197,104,.16)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,system-ui,sans-serif;line-height:1.75}
.en{direction:ltr;unicode-bidi:isolate;font-family:'Plus Jakarta Sans',Inter,Arial,sans-serif;text-align:left}
span.en,small.en{display:inline-block}
button,select,input{font-family:inherit}
header{position:sticky;top:0;z-index:30;background:linear-gradient(90deg,#09321A,#12562F);border-bottom:1.5px solid var(--gold);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap}
header h1{margin:0;font-size:1rem;flex:1;min-width:140px;line-height:1.3}
.hb{background:rgba(255,255,255,.15);color:#fff;border:1px solid transparent;border-radius:10px;padding:6px 10px;cursor:pointer;font-size:.85rem;text-decoration:none;white-space:nowrap}
.logo{border-radius:50%;object-fit:cover;aspect-ratio:1;border:1.5px solid var(--gold);box-shadow:0 3px 12px rgba(0,0,0,.25);background:#FAF9F4;flex:none;display:inline-flex;align-items:center;justify-content:center;color:var(--primary);font-weight:800}
.logo.sm{width:42px;height:42px;font-size:1.3rem}.logo.lg{width:96px;height:96px;font-size:2.8rem;box-shadow:0 0 0 6px rgba(232,197,104,.25),0 0 24px rgba(232,197,104,.35)}
#pbar{position:sticky;top:58px;z-index:20;background:var(--bg);padding:8px 14px 6px;border-bottom:1px solid var(--line)}
#pbar .tr{height:9px}#plabel{font-size:.85rem;color:var(--mut);margin-bottom:4px}
.tr{background:var(--line);border-radius:99px;overflow:hidden}.tr i{display:block;height:100%;background:var(--gold-grad);width:0;transition:width .35s}
main{max-width:760px;margin:0 auto;padding:14px 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.hero{text-align:center;background:linear-gradient(135deg,#09321A,#12562F);color:#fff;border:1.5px solid var(--gold);border-radius:20px;padding:22px 16px;margin-bottom:14px}
.hero h2{margin:8px 0 4px;color:var(--gold-light);font-size:1.5rem}.hero p{margin:0;opacity:.95}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}
.info div{background:var(--hl);border-radius:12px;padding:8px 10px;font-size:.9rem;text-align:center}
label{display:block;font-weight:700;margin:12px 0 4px}
input[type=text],select{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:1rem}
input[type=text]:focus,select:focus{outline:none;border-color:var(--gold)}
.btn{background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:10px 16px;font-size:1rem;cursor:pointer;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--gold)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--primary-light);color:#fff;border-color:var(--primary-light)}
.btn.gold{background:var(--gold-grad);color:#2a1d00;border-color:var(--gold)}
.btn.big{padding:14px 22px;font-size:1.1rem;width:100%}
.btn.wa{background:var(--wa);color:#fff;border-color:var(--wa);display:block;text-align:center;text-decoration:none;padding:14px;font-size:1.05rem;border-radius:14px;margin:10px 0}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:14px}.nav .btn{flex:1}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{display:flex;align-items:center;gap:10px;text-align:right;width:100%;padding:11px 12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;font-size:1rem;cursor:pointer;line-height:1.5}
.opt.en{direction:ltr;text-align:left}
.opt.sel{border-color:var(--gold);background:var(--hl);box-shadow:0 0 0 2px var(--hl)}
.lt{flex:none;width:28px;height:28px;border-radius:50%;background:var(--primary-light);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.sent{background:var(--hl);border-inline-start:4px solid var(--gold);border-radius:12px;padding:12px 14px;font-size:1.2rem;font-weight:600;margin:6px 0 10px}
.q{font-weight:700;font-size:1.05rem;margin:6px 0}.mut{color:var(--mut);font-size:.9rem}
.chat{display:flex;flex-direction:column;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px}
.chat .b{max-width:88%;padding:8px 12px;border-radius:14px;font-size:.98rem}
.chat .b small{display:block;font-weight:700;font-size:.72rem;opacity:.75;margin-bottom:1px}
.chat .t{background:var(--primary-light);color:#fff;align-self:flex-start;border-bottom-left-radius:4px}
.chat .f{background:var(--gold-grad);color:#2a1d00;align-self:flex-end;border-bottom-right-radius:4px}
.chat .note{align-self:center;color:var(--mut);font-size:.85rem;font-style:italic}
details{border:1px solid var(--line);border-radius:14px;margin:10px 0;background:var(--card)}
summary{padding:10px 14px;cursor:pointer;font-weight:700}details>div{padding:0 14px 12px}
input[type=range]{width:100%;accent-color:var(--gold)}
.big-n{font-size:1.5rem;font-weight:800;color:var(--pri);text-align:center}
.w{padding:0 4px;border-radius:6px;display:inline-block;margin:1px}.w.g{background:#bbf7d0;color:#14532d}.w.r{background:#fecaca;color:#7f1d1d}
.rec{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--bad);animation:p 1s infinite;margin-inline-end:6px}@keyframes p{50%{transform:scale(1.6);opacity:.4}}
.circle{width:170px;height:170px;border-radius:50%;margin:8px auto;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--gold) var(--p),var(--line) 0)}
.circle div{width:136px;height:136px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:2.3rem;font-weight:800;color:var(--pri)}
.circle small{font-size:.8rem;color:var(--mut);font-weight:600}
.bar{margin:10px 0}.bl{display:flex;justify-content:space-between;font-size:.95rem}.bar .tr{height:11px}
.rec-box{background:var(--hl);border:1.5px solid var(--gold);border-radius:14px;padding:12px 14px;font-weight:600}
.warn{background:#fff7ed;border:1px solid #f3d9b0;color:#7a4a00;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:.92rem}
:root[data-theme="dark"] .warn{background:rgba(198,149,43,.15);color:#f3dfae}
.rv{border-bottom:1px solid var(--line);padding:8px 0;font-size:.93rem}.rv .ok{color:var(--ok);font-weight:700}.rv .no{color:var(--bad);font-weight:700}
.err{color:var(--bad);font-weight:700;margin-top:8px;min-height:1.4em}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#12303a;color:#fff;padding:10px 18px;border-radius:12px;z-index:99;display:none;max-width:90%;text-align:center}
@media(max-width:480px){header h1{font-size:.9rem}.hb{padding:5px 8px;font-size:.78rem}#pbar{top:92px}}
</style>
</head>

s1:[
{t:"Your microphone is off, please unmute yourself.",o:["صوتك عالٍ جداً، من فضلك اخفضه.","الميكروفون مغلق لديك، من فضلك افتح الصوت.","اتصالك بالإنترنت ضعيف، أعد تشغيل الجهاز.","الكاميرا مغلقة، من فضلك افتحها."],a:1},
{t:"Try to read more slowly and don't be in a hurry, please.",o:["اقرأ بصوت أعلى قليلاً من فضلك.","توقف عند هذه الآية وأعد من البداية.","حاول أن تقرأ ببطء أكثر ولا تتعجّل من فضلك.","اقرأ الآية غيباً دون النظر إلى الشاشة."],a:2},
{t:"Hold that sound for two beats. You stopped the Madd too early.",o:["أطل هذا الصوت لحركتين؛ لقد أوقفت المد مبكراً جداً.","هذه حركة قصيرة، لا تمد الصوت فيها أبداً.","أطل الصوت لأربع حركات؛ لقد مددته أكثر من اللازم.","اصنع قلقلة خفيفة على هذا الحرف عند الوقف."],a:0},
{t:"Please don't give him the answer directly; let him try by himself.",o:["من فضلك ساعده في حل الواجب قبل الحصة القادمة.","من فضلك لا تعطه الإجابة مباشرة؛ دعه يحاول بنفسه.","من فضلك اجعله يتدرب عشر دقائق كل يوم.","من فضلك أرسل لي تسجيلاً صوتياً لقراءته."],a:1}],
s2:[
{s:"Open your mouth a little more. This letter is heavy, not light.",q:"ما المطلوب من الطالب هنا؟",o:["أن يبتسم قليلاً لأن هذا الحرف مرقّق.","أن يفتح فمه أكثر قليلاً لأن هذا الحرف مفخّم وليس مرقّقاً.","أن يضغط شفتيه معاً لأن هذا الحرف فيه غنة.","أن يخرج طرف لسانه بين أسنانه."],a:1},
{s:"Give the time of the Shadda within the letter, not after it.",q:"ما التنبيه الذي يقصده المعلم؟",o:["عدم القلقلة في نهاية الكلمة.","حذف الحرف الساكن في بداية الكلمة.","إعطاء زمن الشدّة داخل الحرف نفسه، لا بتوليد صوت مدّ بعده.","إظهار النون الساكنة قبل حروف الحلق."],a:2},
{s:"The screen is sad because you are not looking at it. Read the highlighted part, please!",q:"ماذا يريد المعلم من الطفل؟",o:["أن يغلق الشاشة ويفتح كتابه الورقي.","أن ينظر إلى الشاشة ويقرأ الجزء المظلّل منها.","أن يرسم وجهاً حزيناً على السبورة.","أن يأخذ استراحة قصيرة لأن الشاشة لا تعمل."],a:1},
{s:"I'm sorry, I missed the connection. What is the suitable time to make up the class?",q:"ما المقصود بهذه الرسالة؟",o:["أعتذر عن التأخير، وأريد إلغاء الاشتراك.","أعتذر لانقطاع الاتصال، ما الوقت المناسب لتعويض الحصة؟","أعتذر عن الضوضاء من جانبي، سنكمل الحصة الآن.","أعتذر، هل يمكننا تقليص مدة الحصة إلى نصف ساعة؟"],a:1},
{s:null,q:"أيّ الجمل التالية هي الصياغة الإنجليزية الصحيحة والطبيعية لتقول لطالبك: «قراءتك جيدة، تحتاج فقط أن تركّز، اقرأها مرة أخرى»؟",ltr:true,o:["Your reading is good, you need just to focus. Read it one more time again.","Your reading is good, you just need to focus. Read it one more time.","You take too much time until you finish. Then go back again.","He need more practice. Start reading."],a:1}],
dlg:[["Teacher","Can you see my screen, my hero?"],["Fadi","No."],["Teacher","What about now? Can you see it now?"],["Fadi","Yes!"],["Teacher","Perfect, Masha'Allah! Now open your mic and start reading this ayah in one go, please."],["note","[Fadi reads]"],["Teacher","Good job, my hero, but we made two small mistakes here. First, don't make a wave here — just one beat. Second, why did you make Qalqalah with Kaf? Just Sukoon with Kaf! Try one more time."],["note","[Fadi reads correctly]"],["Teacher","Excellent! Now let's play our quick game. Let's give Mrs. Tommy the strawberry; she is hungry!"],["note","[After the game]"],["Teacher","Okay, my hero, say bye to Mrs. Tommy. Let's go back to our new lesson. When we read the Quran, we have Noon Sakinah and Tanween, and they have four rules. Today's rule is Izhar. In Tajweed, Izhar means you pronounce Noon Sakinah or Tanween clearly."],["Fadi","When do we pronounce it clearly?"],["Teacher","When Noon Sakinah or Tanween is followed by one of the six throat letters, like Hamza and Ha. For your homework, please practice the last part of page 143. See you next time!"]],
s3:[
{q:"ما المشكلة التقنية في بداية الحوار، وماذا طلب المعلم بعدها؟",o:["كانت الكاميرا مغلقة وطلب المعلم من الطالب فتحها.","لم يكن الطالب يرى الشاشة أولاً ثم رآها، وطلب منه المعلم فتح المايك والبدء بقراءة الآية دفعة واحدة.","كان صوت المعلم يتقطّع فأغلق المكالمة وأعاد الاتصال.","لم يجد الطالب رقم الصفحة في كتابه."],a:1},
{q:"ما الخطآن اللذان صحّحهما المعلم لـ «فادي» أثناء القراءة؟",o:["نسي الغنة في الميم، ولم يقف في نهاية الآية.","قرأ بسرعة شديدة، وحذف حرفاً من الكلمة.","مدّ الصوت أكثر من اللازم (والمطلوب حركة واحدة)، وعمل قلقلة في حرف الكاف الساكن.","خلط بين حرفي التاء والطاء، ولم يقرأ الآية كاملة."],a:2},
{q:"ما دور شخصية «Mrs. Tommy» في هذا الجزء من الحصة؟",o:["هي والدة الطالب التي تتابع معه الحصة.","هي لعبة سريعة كافأ بها المعلم الطالب على القراءة الصحيحة ثم عاد بعدها للدرس الجديد.","هي المعلمة السابقة للطالب.","هي اسم قاعدة التجويد الجديدة."],a:1},
{q:"بحسب شرح المعلم، متى ننطق النون الساكنة أو التنوين بوضوح (الإظهار)؟",o:["عندما تأتي في نهاية الآية فقط.","عندما يأتي بعدها أحد حروف القلقلة.","عندما يأتي بعدها أحد حروف الحلق الستة مثل الهمزة والهاء.","عندما تكون النون مشدّدة فقط."],a:2},
{q:"ما الواجب المنزلي الذي حدّده المعلم في نهاية الحوار؟",o:["حفظ حروف الحلق الستة وكتابتها في الدفتر.","التدرب على الجزء الأخير من صفحة 143.","إرسال تسجيل صوتي لسورة كاملة.","إعادة قراءة صفحة 142 ثلاث مرات."],a:1}],
sp:["Hello! How are you today? Are you ready to start?","Can you see my screen? Please turn on your microphone.","Try to read more slowly and do not rush, please.","Hold this sound for two beats, then try one more time.","Good job today! Do not forget to practice your homework."],

{q:"أغلق الطالب الكاميرا، وتريد أن تطلب منه بلطف إبقاءها مفتوحة أثناء الحصة:",o:["Close your camera and listen to me.","Please keep your camera on during the class.","Why you don't see my screen?","Your connection is weak today."],a:1},
{q:"يقرأ الطالب الكلمة متقطّعة، وتريد منه قراءتها دفعةً واحدة دون توقف:",o:["Read it in one go, don't stop in the middle.","Say the letter only, not the word.","Stop at this word and close your book.","Skip this word and read the next page."],a:0},
{q:"أخطأ الطالب في حركة الحرف، وتريد تنبيهه بلطف ليتحقق من الحركة:",o:["This letter has no dots.","You finished earlier than I expected.","Almost right! The mistake is in the vowel, check it.","Let's reschedule another time."],a:2},
{q:"انشغل طفل صغير بلعبة بجانبه، وتريد جذبه بهدوء للحصة أولاً:",o:["Put the toy down, please — class first, then we can play.","Don't come back to the class.","The class duration will be thirty minutes.","What is your favourite sport?"],a:0},
{q:"انتهى وقت الحصة وتريد توديع الطالب حتى الحصة القادمة:",o:["Let's warm up first before we start.","Our class time has ended. See you next class, Insha'Allah.","Which page are you on right now?","Can you refresh the page, please?"],a:1}]};
const NUM={"1":"one","2":"two","3":"three","4":"four","5":"five"};
function norm(s){return String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/can't/g,"cannot").replace(/won't/g,"will not").replace(/n't/g," not").replace(/\bi'm\b/g,"i am").replace(/let's/g,"let us").replace(/it's/g,"it is").replace(/'ll/g," will").replace(/'re/g," are").replace(/'ve/g," have").replace(/'d/g," would").replace(/can not/g,"cannot").replace(/\bpractise\b/g,"practice").replace(/\bmic\b/g,"microphone").replace(/\bok\b/g,"okay").replace(/[^a-z0-9\s]/g," ").replace(/\b[1-5]\b/g,m=>NUM[m]).replace(/\s+/g," ").trim()}
function evaluate(target,heard){const tokens=target.split(/\s+/),T=tokens.map(norm),H=norm(heard).split(" ").filter(Boolean);const n=T.length,m=H.length,L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)L[i][j]=T[i-1]&&T[i-1]===H[j-1]?L[i-1][j-1]+1:Math.max(L[i-1][j],L[i][j-1]);
